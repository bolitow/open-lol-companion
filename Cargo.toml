[workspace]
resolver = "2"
members = ["crates/lcu-connector", "apps/desktop/src-tauri", "services/collector"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bolitow/open-lol-companion"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tokio = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# TLS en Rust pur (ring) : pas d'OpenSSL ni d'outils natifs à installer sur Windows et macOS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "__rustls-tls"] }
