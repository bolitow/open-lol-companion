[package]
name = "lcu-connector"
version = "0.1.0"
description = "Localise le client League of Legends (lockfile ou arguments du processus) et fournit les identifiants de la League Client API."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
futures-util.workspace = true
rustls.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util", "test-util"] }
