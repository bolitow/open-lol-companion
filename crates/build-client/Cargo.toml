[package]
name = "olc-build-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
olc-catalog-cache = { path = "../catalog-cache" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots = "1"
tokio = { workspace = true, features = ["sync", "time"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
sha2 = "0.10"
fs2 = "0.4.3"
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# Trousseau natif du système pour le jeton d'accès desktop : Keychain sous macOS,
# Gestionnaire d'identifiants sous Windows. Sans ces fonctionnalités, keyring
# utiliserait un stockage en mémoire non persistant.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
