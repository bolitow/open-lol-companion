name: CI

# Uniquement sur les pull requests vers main (et à la demande) : rien ne tourne au
# push d'une branche ni après une fusion, le code a déjà été vérifié dans la PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Le résumé du job suffit : pas d'artefact SARIF conservé 90 jours à chaque run.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - "apps/desktop/**"
              - "crates/**"
              - "packages/shared/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "pnpm-lock.yaml"
              - ".github/workflows/ci.yml"

  checks:
    name: Tests et typage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Formatage Rust
        run: cargo fmt --all --check
      - name: Clippy (connecteur LCU)
        run: cargo clippy -p lcu-connector --all-targets -- -D warnings
      - run: pnpm --filter @olc/shared test
      - run: pnpm --filter @olc/desktop build
      - run: cargo test -p lcu-connector

  # Windows et macOS : les runners les plus lents. Seulement si le code de l'app ou
  # du connecteur change, et pas sur une PR en brouillon.
  desktop:
    name: App desktop (${{ matrix.os }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.desktop == 'true' && !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Tests du connecteur LCU
        run: cargo test -p lcu-connector
      - name: Compilation de l'app (debug, sans installeur)
        run: pnpm --filter @olc/desktop tauri build --debug --no-bundle
      - name: Clippy (workspace complet)
        run: cargo clippy --workspace --all-targets -- -D warnings
